name: SpritesApp
packages:
  Sprites:
    path: .
targets:
  SpritesApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [App]
    dependencies:
      - package: Sprites
        product: SpritesUI
    settings:
      GENERATE_INFOPLIST_FILE: YES
      # Without a launch screen iOS letterboxes the app to legacy size.
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      PRODUCT_BUNDLE_IDENTIFIER: dev.goranmoomin.SpritesApp
