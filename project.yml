name: SpritesApp
fileTypes:
  # Treat the .icon package as an opaque resource, not a group to recurse into.
  icon:
    file: true
packages:
  Sprites:
    path: .
targets:
  SpritesApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [App]
    dependencies:
      - package: Sprites
        product: SpritesUI
    settings:
      SWIFT_VERSION: "6.0"
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      GENERATE_INFOPLIST_FILE: YES
      # Without a launch screen iOS letterboxes the app to legacy size.
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      PRODUCT_BUNDLE_IDENTIFIER: dev.goranmoomin.SpritesApp
